name: CI

# Fast, always-green gates: formatting, the core build (no Vulkan/SDL/Slang needed) and a
# sanitizer run. The full engine build lives in full-build.yml because it needs the Vulkan SDK.
on:
  push:
    branches: [main, refactor, 'dev-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the version used by the developers, otherwise the format gate reports
  # differences that only exist between clang-format releases.
  CLANG_FORMAT_VERSION: 22.1.5
  CC: clang
  CXX: clang++
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: pip install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            .github/scripts/check-format.sh "origin/${GITHUB_BASE_REF}"
          else
            .github/scripts/check-format.sh
          fi

  core:
    name: core ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [core-debug, core-release]
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: ${{ runner.os }}-${{ matrix.preset }}-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-${{ matrix.preset }}-deps-
      - name: Toolchain versions
        run: cmake --version && ${CXX} --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log
      - name: Check project warnings
        run: .github/scripts/check-warnings.sh build.log 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: core asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/core-asan/_deps
          key: ${{ runner.os }}-core-asan-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-core-asan-deps-
      - name: Configure
        run: cmake --preset core-asan
      - name: Build
        run: cmake --build --preset core-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset core-asan
