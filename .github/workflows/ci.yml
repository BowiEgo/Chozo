name: CI

# Formatting, the core build (no Vulkan/SDL/Slang needed), a sanitizer run, and the complete
# engine build with the Vulkan backend and the editor.
on:
  push:
    branches: [main, refactor, 'dev-*']
  pull_request:
  # Weekly safety net: everything runs once a week, including the expensive macOS full build.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the version used by the developers, otherwise the format gate reports
  # differences that only exist between clang-format releases.
  CLANG_FORMAT_VERSION: 22.1.5
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: pip install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            .github/scripts/check-format.sh "origin/${GITHUB_BASE_REF}"
          else
            .github/scripts/check-format.sh
          fi

  core:
    name: core ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        preset: [core-debug, core-release]
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: ${{ runner.os }}-${{ matrix.preset }}-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-${{ matrix.preset }}-deps-
      - name: Toolchain versions
        run: cmake --version && ${CXX} --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log
      - name: Check project warnings
        run: .github/scripts/check-warnings.sh build.log 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 120

  windows-core:
    name: core windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/core-debug/_deps
          key: ${{ runner.os }}-core-debug-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-core-debug-deps-
      - name: Configure
        run: cmake --preset core-debug
      - name: Build
        run: cmake --build --preset core-debug --config Debug
      - name: Test
        run: ctest --preset core-debug -C Debug --output-on-failure --timeout 120

  # Windows first: the complete build (Vulkan backend + editor) needs the Vulkan SDK from
  # Chocolatey. Like the macOS full build it only runs for pull requests, the weekly schedule and
  # manual dispatches.
  full-windows:
    name: full build (Windows + Vulkan)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Work in progress: compilation succeeds, the link step fails while exporting symbols
    # (CMake's WINDOWS_EXPORT_ALL_SYMBOLS generates an exports.def containing a bogus `__`
    # entry on this toolchain, LNK2001). Tracked in docs/P2-PLAN.md (G7); non-blocking until
    # the modules either export explicitly or the .def is sanitised.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        run: choco install vulkan-sdk --no-progress -y
      - name: Export VULKAN_SDK
        shell: pwsh
        run: |
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "using $($sdk.FullName)"
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/full-release/_deps
          key: ${{ runner.os }}-full-release-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-full-release-deps-
      - name: Configure
        run: cmake --preset full-release
      - name: Build
        # Git Bash: the runners default to PowerShell, which does not know `set -o pipefail`.
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset full-release --config Release 2>&1 | tee build.log
      - name: Check project warnings
        shell: bash
        run: bash .github/scripts/check-warnings.sh build.log 0
      - name: Test
        # slang.dll sits in the prebuilt SDK, so it has to be reachable for the test binaries.
        shell: pwsh
        run: |
          $slang = Get-ChildItem build/full-release/_deps/slang_prebuilt-src -Directory | Select-Object -First 1
          $env:PATH = "$($slang.FullName)\bin;$env:PATH"
          ctest --preset full-release -C Release --output-on-failure --timeout 300

  # macOS runners consume ten times the minutes of a Linux runner, so the complete build only
  # runs for pull requests, the weekly schedule and manual dispatches - not for every push.
  full-macos:
    name: full build (macOS + Vulkan)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 60
    # The Vulkan loader, headers and MoltenVK come from Homebrew; VULKAN_SDK points CMake at that
    # prefix, so no assumption about a LunarG SDK layout is needed.
    env:
      VULKAN_SDK: /opt/homebrew
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan (loader, headers, MoltenVK)
        run: brew install molten-vk vulkan-headers vulkan-loader
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/full-release/_deps
          key: ${{ runner.os }}-full-release-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-full-release-deps-
      - name: Configure
        run: cmake --preset full-release
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset full-release 2>&1 | tee build.log
      # Known warnings: Basic.slang vertex attributes, VulkanTextureObj unused field, Editor
      # C-linkage. The budget is lowered as they are fixed (see docs/P2-PLAN.md, G8).
      - name: Check project warnings
        run: .github/scripts/check-warnings.sh build.log 4
      - name: Test
        run: ctest --preset full-release --output-on-failure --timeout 300

  sanitizers:
    name: core asan+ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/core-asan/_deps
          key: ${{ runner.os }}-core-asan-deps-${{ hashFiles('CMake/FetchDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-core-asan-deps-
      - name: Configure
        run: cmake --preset core-asan
      - name: Build
        run: cmake --build --preset core-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset core-asan --timeout 120
