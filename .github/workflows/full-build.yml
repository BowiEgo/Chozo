name: Full build (macOS + Vulkan)

# The complete engine build (runtime, Vulkan backend, editor, launcher) needs the Vulkan SDK,
# SDL, Slang, ImGui and Tracy, so it is kept out of the default CI:
#   * it is slow (large dependency downloads) and
#   * the SDK discovery in CMake still assumes a local SDK layout (see docs/P2-PLAN.md, G5).
# Run it manually from the Actions tab; it becomes part of ci.yml once G5 has landed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.4.335.1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  full-macos:
    name: full build (Release + tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: ~/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: ${{ runner.os }}-vulkansdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/VulkanSDK"
          curl -L --fail -o /tmp/vulkansdk.zip \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip"
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk
          installer=$(find /tmp/vulkansdk -maxdepth 3 -name install_vulkan.py | head -1)
          test -n "$installer"
          cd "$(dirname "$installer")"
          ./install_vulkan.py --accept-licenses --default-answer --confirm-command \
            install --root "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}"

      - name: Configure
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK_ROOT }}
        run: |
          export VULKAN_SDK="$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS"
          cmake --preset full-release

      - name: Build
        run: |
          set -o pipefail
          export VULKAN_SDK="$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS"
          cmake --build --preset full-release 2>&1 | tee build.log

      # The full build still has a few known warnings (Basic.slang vertex attributes,
      # VulkanTextureObj unused field, Editor C-linkage); they are tracked in
      # docs/P2-PLAN.md and this budget is lowered as they get fixed.
      - name: Check project warnings
        run: .github/scripts/check-warnings.sh build.log 4

      - name: Test
        run: ctest --preset full-release --output-on-failure
